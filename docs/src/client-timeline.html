<text x="1073.5" y="122.0" class="codeb" text-anchor="start" >snapshot says lastSeq = 2</text>
<text x="1073.5" y="142.0" class="code" text-anchor="start" >drop #1..#2   replay #3 #4 on top of server state</text>
<text x="1073.5" y="162.0" class="code" text-anchor="start" >result → prediction.state; diff → correction vector</text>

<text x="655.5" y="668.0" class="code" text-anchor="start" >broadcast snap{tick, players[], cubes[]}</text>
<rect x="40.0" y="700.0" width="500.0" height="240.0" rx="4" class="panel"/>
<text x="56.0" y="728.0" class="ptitle" text-anchor="start" >Inside one frame  (Game.frame, every rAF)</text>
<text x="56.0" y="756.0" class="code" text-anchor="start" >input.update()            fold mouse motion into yaw/pitch</text>
<text x="56.0" y="780.0" class="code" text-anchor="start" >accumulator += dt</text>
<text x="56.0" y="804.0" class="code" text-anchor="start" >while accumulator >= 1/30:</text>
<text x="56.0" y="828.0" class="code" text-anchor="start" >    f = input.sampleFrame(seq++)</text>
<text x="56.0" y="852.0" class="code" text-anchor="start" >    prediction.apply(f)    stepPlayer locally, keep f pending</text>
<text x="56.0" y="876.0" class="code" text-anchor="start" >    conn.send({t:"input", f})</text>
<text x="56.0" y="900.0" class="code" text-anchor="start" >correction *= decay;  camera = prediction.pos + correction</text>
<text x="56.0" y="924.0" class="code" text-anchor="start" >avatars/cubes = interp.sample(now - 100 ms);  scene.render()</text>
<rect x="580.0" y="700.0" width="500.0" height="240.0" rx="4" class="panel"/>
<text x="596.0" y="728.0" class="ptitle" text-anchor="start" >Inside one snapshot  (Game.handle, ws.onmessage)</text>
<text x="596.0" y="756.0" class="code" text-anchor="start" >interp.push(tick, players, cubes)     for everyone else</text>
<text x="596.0" y="780.0" class="code" text-anchor="start" >me = players[myId]</text>
<text x="596.0" y="804.0" class="code" text-anchor="start" >delta = prediction.reconcile(me):</text>
<text x="596.0" y="828.0" class="code" text-anchor="start" >    pending = pending.filter(seq > me.lastSeq)</text>
<text x="596.0" y="852.0" class="code" text-anchor="start" >    state = clone(me); for f in pending: stepPlayer(state, f)</text>
<text x="596.0" y="876.0" class="code" text-anchor="start" >    return oldPos - state.pos</text>
<text x="596.0" y="900.0" class="code" text-anchor="start" >correction += delta   (or reset to 0 if |delta| > 3 m)</text>
<text x="596.0" y="924.0" class="code" text-anchor="start" >nothing renders here; the next frame draws the new state</text>
<rect x="1120.0" y="700.0" width="540.0" height="240.0" rx="4" class="panel"/>
<text x="1136.0" y="728.0" class="ptitle" text-anchor="start" >Why this works without threads</text>
<text x="1136.0" y="756.0" class="code" text-anchor="start" >JS runs one callback at a time. A snapshot arriving</text>
<text x="1136.0" y="780.0" class="code" text-anchor="start" >mid-frame waits until the frame returns.</text>
<text x="1136.0" y="804.0" class="code" text-anchor="start" ></text>
<text x="1136.0" y="828.0" class="code" text-anchor="start" >So reconcile always sees a consistent prediction.state,</text>
<text x="1136.0" y="852.0" class="code" text-anchor="start" >and a frame always sees a fully reconciled one.</text>
<text x="1136.0" y="876.0" class="code" text-anchor="start" ></text>
<text x="1136.0" y="900.0" class="code" text-anchor="start" >The "two timelines" are just two callback sources</text>
<text x="1136.0" y="924.0" class="code" text-anchor="start" >feeding one queue: rAF at 60 Hz, onmessage at 30 Hz.</text></svg></body></html>
