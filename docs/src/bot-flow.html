<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#0f1117;font-family:ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
text{fill:#e6e8ef;font-size:13px}
.title{font-size:20px;font-weight:700}.sub{font-size:12px;fill:#9aa3b5}.h{font-size:15px;font-weight:700}.lane{font-size:14px;font-weight:700}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;fill:#d7dbe6}
.tag{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;fill:#c58cff}
.box{fill:#1a1f2b;stroke:#3a4152;stroke-width:1.3;rx:8}.modal{stroke:#5ee6a8}.browser{stroke:#6ea8fe}.proxy{stroke:#c58cff}.bot{stroke:#f6c453}
.panel{fill:#161a24;stroke:#2a3040;rx:10}.hl{fill:#232a3a;rx:6}
.lifeline{stroke:#3a4152;stroke-width:1.5;stroke-dasharray:4 5}
.a{stroke:#e6e8ef;stroke-width:1.6;fill:none;marker-end:url(#m)}
.a.ws{stroke:#5ee6a8;stroke-width:2.4;marker-end:url(#mg);marker-start:url(#mg0)}
.a.ctl{stroke:#f6c453;marker-end:url(#my)}
.a.nav{stroke:#6ea8fe;stroke-width:2;marker-end:url(#mb)}
.lbl{font-size:12px}.lbl2{font-size:11px;fill:#9aa3b5}.nav{fill:#6ea8fe}.ctl{fill:#f6c453}.ws{fill:#5ee6a8}
.step{font-weight:700;fill:#0f1117;font-size:11px}
</style></head><body>
<svg width="1560" height="960" viewBox="0 0 1560 960" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e6e8ef"/></marker>
<marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6ea8fe"/></marker>
<marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5ee6a8"/></marker>
<marker id="mg0" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#5ee6a8"/></marker>
<marker id="my" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f6c453"/></marker>
</defs>
<text x="40" y="40" class="title">kathir world: how a bot gets into a room</text>
<text x="40" y="62" class="sub">A bot is a Modal function running a headless Python player. Chat starts it via a localhost sidecar in the Room container; it joins through the lobby like a browser, flagged as a bot.</text>

<!-- lanes -->
<g>
<rect x="40" y="90" width="180" height="60" class="box browser"/><text x="130" y="114" text-anchor="middle" class="lane">Browser</text><text x="130" y="134" text-anchor="middle" class="sub">kathir, in room "late-night"</text>
<rect x="290" y="90" width="300" height="60" class="box modal"/><text x="440" y="114" text-anchor="middle" class="lane">Room container</text><text x="440" y="134" text-anchor="middle" class="tag">Node room server + Python sidecar :8001</text>
<rect x="660" y="90" width="200" height="60" class="box proxy"/><text x="760" y="114" text-anchor="middle" class="lane">Modal</text><text x="760" y="134" text-anchor="middle" class="sub">control plane · FPRS proxy</text>
<rect x="930" y="90" width="220" height="60" class="box bot"/><text x="1040" y="114" text-anchor="middle" class="lane">Bot container</text><text x="1040" y="134" text-anchor="middle" class="tag">kathir-world-bots/run_bot</text>
<rect x="1240" y="90" width="280" height="60" class="box modal"/><text x="1380" y="114" text-anchor="middle" class="lane">lobby</text><text x="1380" y="134" text-anchor="middle" class="tag">@app.function · /join/{room}</text>
<line x1="130" y1="150" x2="130" y2="760" class="lifeline"/><line x1="440" y1="150" x2="440" y2="760" class="lifeline"/><line x1="760" y1="150" x2="760" y2="760" class="lifeline"/><line x1="1040" y1="150" x2="1040" y2="760" class="lifeline"/><line x1="1380" y1="150" x2="1380" y2="760" class="lifeline"/>
</g>

<!-- 1 chat -->
<circle cx="150" cy="190" r="9" fill="#6ea8fe"/><text x="150" y="194" text-anchor="middle" class="step">1</text>
<line x1="165" y1="190" x2="435" y2="190" class="a nav"/><text x="300" y="182" text-anchor="middle" class="code nav">chat "/circle-bot 60"</text>
<rect x="300" y="205" width="280" height="70" class="hl"/>
<text x="310" y="223" class="code">Room.callBot: a person? a free seat?</text>
<text x="310" y="240" class="code">spawner configured? → broadcast system</text>
<text x="310" y="257" class="code">"kathir called circle-bot for 60s"</text>
<line x1="435" y1="292" x2="137" y2="292" class="a"/><text x="290" y="309" text-anchor="middle" class="lbl2">everyone in the room sees the announcement (chat is people-only: bots can't call bots)</text>

<!-- 2 sidecar -->
<circle cx="440" cy="345" r="9" fill="#5ee6a8"/><text x="440" y="349" text-anchor="middle" class="step">2</text>
<rect x="300" y="360" width="280" height="52" class="hl"/>
<text x="310" y="378" class="code">Node → POST http://127.0.0.1:8001/bots</text>
<text x="310" y="395" class="code">{bot:"circle", room:"late-night", seconds:60, caller}</text>
<text x="300" y="428" class="lbl2">Node holds no Modal token; the Python process next to it has the container's own credentials.</text>

<!-- 3 spawn -->
<circle cx="600" cy="460" r="9" fill="#f6c453"/><text x="600" y="464" text-anchor="middle" class="step">3</text>
<line x1="615" y1="460" x2="755" y2="460" class="a ctl"/><text x="685" y="452" text-anchor="middle" class="code ctl">Function.from_name(…).spawn()</text>
<line x1="765" y1="480" x2="1035" y2="480" class="a ctl"/><text x="900" y="473" text-anchor="middle" class="lbl2">queue one input: run_bot(bot, room, seconds) · container starts (or reuses a warm one)</text>
<line x1="755" y1="500" x2="447" y2="500" class="a"/><text x="600" y="517" text-anchor="middle" class="lbl2">202 + function call id → Node logs it. Failure → 502 → "couldn't call circle-bot" to the caller.</text>

<!-- 4 lobby -->
<circle cx="1060" cy="555" r="9" fill="#f6c453"/><text x="1060" y="559" text-anchor="middle" class="step">4</text>
<line x1="1075" y1="555" x2="1375" y2="555" class="a ctl"/><text x="1225" y="547" text-anchor="middle" class="code ctl">GET lobby/join/late-night?name=circle-bot  (no redirect follow)</text>
<line x1="1375" y1="585" x2="1047" y2="585" class="a"/><text x="1225" y="602" text-anchor="middle" class="code">302 Location: room-host/?modal_session_token=…  → read the token, drop the URL</text>
<text x="940" y="625" class="lbl2">Same Dict lookup as a browser: the live session for "late-night", so the bot lands in kathir's room.</text>

<!-- 5 websocket -->
<circle cx="1020" cy="660" r="9" fill="#5ee6a8"/><text x="1020" y="664" text-anchor="middle" class="step">5</text>
<line x1="1005" y1="660" x2="447" y2="660" class="a ws"/><text x="726" y="652" text-anchor="middle" class="code ws">wss://room-host/ws?room=late-night&amp;name=circle-bot&amp;bot=1   +   Modal-Authorization: Bearer &lt;token&gt;</text>
<text x="726" y="680" text-anchor="middle" class="lbl2">FPRS routes by the token to the session's container; Node seats it with bot=true. bot=1 is a declaration, not auth: the browser never sends it.</text>

<!-- 6 play -->
<circle cx="1020" cy="715" r="9" fill="#5ee6a8"/><text x="1020" y="719" text-anchor="middle" class="step">6</text>
<line x1="1005" y1="715" x2="447" y2="715" class="a ws"/><text x="726" y="707" text-anchor="middle" class="code ws">snapshots down at 30 Hz · input frames up at 30 Hz (Controls + run_input_loop) · chat</text>
<text x="726" y="735" text-anchor="middle" class="lbl2">Roster shows a robot icon. The bot's report goes to Modal function logs when it ends.</text>

<!-- footer -->
<rect x="40" y="790" width="1480" height="150" class="panel"/>
<text x="56" y="814" class="h">How it ends</text>
<text x="56" y="838" class="lbl">• Time's up (default 300 s, max 3500): the bot closes its socket; Node removes the seat.</text>
<text x="56" y="860" class="lbl">• Killed: no respawn. The seat is kept (no 13 s corpse cleanup for bots), so it lies there until its time is up; a browser's corpse is dropped after the death screen.</text>
<text x="56" y="882" class="lbl">• Last person leaves: bots don't keep a room open. 30 s later Node closes the room and closes every bot socket with reason "room closed"; the function returns its report.</text>
<text x="56" y="904" class="lbl">• No bot cap: the room's 32 seats are the only limit. A full room answers the caller "this room is full"; a bot that finds it full by the time it arrives fails in Modal logs.</text>
<text x="56" y="926" class="lbl2">Local dev: no sidecar, so "/circle-bot" answers "bots can't be called in this room"; bots are run by hand with direct_ws_url. The manual path (modal run … --bot circle) is the same function without steps 1 to 3.</text>
</svg></body></html>
