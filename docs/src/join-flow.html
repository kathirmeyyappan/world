<text x="40" y="40" class="title">kathir world: how a player gets into a room</text>
<text x="40" y="62" class="sub">Modal's proxy only accepts a browser session as a host-bound cookie, so the game page is served by the Room host. The lobby (a web function) starts sessions and bounces the browser there.</text>

<!-- lanes -->
<g>
<rect x="40" y="90" width="200" height="60" class="box browser"/><text x="140" y="114" text-anchor="middle" class="lane">Browser</text><text x="140" y="134" text-anchor="middle" class="sub">address bar shown per step</text>
<rect x="340" y="90" width="200" height="60" class="box browser"/><text x="440" y="114" text-anchor="middle" class="lane">GitHub Pages</text><text x="440" y="134" text-anchor="middle" class="sub">world.kathirm.com · static launcher</text>
<rect x="640" y="90" width="220" height="60" class="box modal"/><text x="750" y="114" text-anchor="middle" class="lane">lobby</text><text x="750" y="134" text-anchor="middle" class="tag">@app.function + asgi_app</text>
<rect x="960" y="90" width="200" height="60" class="box proxy"/><text x="1060" y="114" text-anchor="middle" class="lane">FPRS</text><text x="1060" y="134" text-anchor="middle" class="sub">Modal's proxy</text>
<rect x="1260" y="90" width="260" height="60" class="box modal"/><text x="1390" y="114" text-anchor="middle" class="lane">Room container</text><text x="1390" y="134" text-anchor="middle" class="sub">@modal.sessioned() · min_containers=1 · Node</text>
<line x1="140" y1="150" x2="140" y2="740" class="lifeline"/><line x1="440" y1="150" x2="440" y2="740" class="lifeline"/><line x1="750" y1="150" x2="750" y2="740" class="lifeline"/><line x1="1060" y1="150" x2="1060" y2="740" class="lifeline"/><line x1="1390" y1="150" x2="1390" y2="740" class="lifeline"/>
</g>

<!-- 1 -->
<circle cx="160" cy="190" r="9" fill="#6ea8fe"/><text x="160" y="194" text-anchor="middle" class="step">1</text>
<line x1="175" y1="190" x2="435" y2="190" class="a"/><text x="305" y="182" text-anchor="middle" class="code">GET world.kathirm.com</text>
<line x1="435" y1="220" x2="147" y2="220" class="a"/><text x="290" y="238" text-anchor="middle" class="lbl2">home screen · LOBBY_URL baked in by the Pages build</text>
<text x="40" y="262" class="lbl2">address bar: world.kathirm.com</text>

<!-- 2 -->
<circle cx="160" cy="300" r="9" fill="#6ea8fe"/><text x="160" y="304" text-anchor="middle" class="step">2</text>
<line x1="175" y1="300" x2="745" y2="300" class="a nav"/><text x="460" y="292" text-anchor="middle" class="code nav">click JOIN → location.href = lobby/join/global?name=kathir</text>
<text x="460" y="316" text-anchor="middle" class="lbl2">a navigation, not a fetch. No CORS, no token in JavaScript.</text>

<!-- 3 -->
<rect x="620" y="326" width="260" height="70" class="hl"/>
<text x="630" y="344" class="code">entry = Dict.get("global")</text>
<text x="630" y="361" class="code">alive? GET room/healthz w/ token</text><text x="630" y="378" class="code">dead or none → sessions.start()</text>
<circle cx="900" cy="358" r="9" fill="#f6c453"/><text x="900" y="362" text-anchor="middle" class="step">3</text>
<line x1="913" y1="358" x2="1055" y2="358" class="a ctl"/><text x="985" y="350" text-anchor="middle" class="lbl2 ctl">proxy auth, lobby only</text>
<line x1="1063" y1="378" x2="1385" y2="378" class="a ctl"/><text x="1225" y="371" text-anchor="middle" class="lbl2">place sd-… on the least-loaded container</text>

<!-- 4 -->
<circle cx="730" cy="420" r="9" fill="#f6c453"/><text x="730" y="424" text-anchor="middle" class="step">4</text>
<line x1="715" y1="420" x2="147" y2="420" class="a"/><text x="430" y="412" text-anchor="middle" class="code">302 → room-host/?modal_session_token=…&amp;room=global&amp;direct=1&amp;name=kathir&amp;lobby=…&amp;home=…</text>

<!-- 5 -->
<circle cx="160" cy="470" r="9" fill="#6ea8fe"/><text x="160" y="474" text-anchor="middle" class="step">5</text>
<line x1="175" y1="470" x2="1055" y2="470" class="a nav"/><text x="600" y="462" text-anchor="middle" class="code nav">browser follows: GET room-host/?modal_session_token=…</text>
<rect x="960" y="482" width="200" height="40" class="hl"/><text x="970" y="498" class="code">verify JWT, don't forward it:</text><text x="970" y="514" class="code">set cookie, strip param</text>
<line x1="1055" y1="540" x2="147" y2="540" class="a"/><text x="600" y="532" text-anchor="middle" class="code">307 → room-host/?room=global&amp;direct=1&amp;name=kathir   +   Set-Cookie: __Host-modal-server-session=&lt;token&gt;</text>
<text x="40" y="566" class="lbl2">address bar: …kathir-world-room.us-east.modal.direct  (this is the one visible change: you play on the room host, not on kathirm.com)</text>

<!-- 6 -->
<circle cx="160" cy="600" r="9" fill="#6ea8fe"/><text x="160" y="604" text-anchor="middle" class="step">6</text>
<line x1="175" y1="600" x2="1385" y2="600" class="a nav"/><text x="700" y="592" text-anchor="middle" class="code nav">GET room-host/?room=global&amp;direct=1   (cookie attached automatically: same host)</text>
<text x="1075" y="614" class="lbl2">cookie → x-modal-server-session-id, pinned</text>
<line x1="1385" y1="630" x2="147" y2="630" class="a"/><text x="700" y="646" text-anchor="middle" class="lbl2">Node serves index.html (with the lobby URL in a &lt;meta&gt; tag) + assets. Client sees ?direct=1 (connect here, no lobby), keeps ?lobby= for invites and ?home= for "exit to home".</text>

<!-- 7 -->
<circle cx="160" cy="690" r="9" fill="#6ea8fe"/><text x="160" y="694" text-anchor="middle" class="step">7</text>
<line x1="175" y1="690" x2="1385" y2="690" class="a ws"/><text x="700" y="682" text-anchor="middle" class="code ws">new WebSocket("wss://room-host/ws?room=global&amp;name=kathir")   same-origin → cookie rides along → FPRS pins → Node keys room by session id</text>
<text x="700" y="712" text-anchor="middle" class="lbl2">from here: input frames (movement, look, item actions) and chat up; snapshots and events down (protocol.ts)</text>

<!-- footer -->
<rect x="40" y="760" width="1480" height="120" class="panel"/>
<text x="56" y="784" class="h">Notes</text>
<text x="56" y="808" class="lbl">• The browser never holds a token in JavaScript: the lobby redirects with it once, the proxy turns it into an HttpOnly cookie. A pasted Room host URL lands on the home screen and joins via the lobby again; invites are lobby/join/&lt;room&gt;.</text>
<text x="56" y="830" class="lbl">• Cached sessions die on redeploy, 5 min idle or the 25 h token lifetime; the lobby checks before redirecting. Node closes a room 30 s after its last person leaves (bots don't count). min_containers=1: session start does not scale the Room up from zero.</text>
<text x="56" y="852" class="lbl">• Deploys: push to main → Pages (launcher); modal deploy -m infra.app → lobby + Room; modal deploy modal-bots/app.py → bots. Client changes need the first two, since the Room image bundles its own client. Bots: see bot-flow.png.</text>
<text x="56" y="874" class="lbl2">Why not the token in the WebSocket URL: FPRS answers with the same 307 and WebSocket clients cannot follow redirects. Why not play on kathirm.com: the cookie is __Host- and SameSite=Lax, so only the Room host can carry it.</text>
</svg></body></html>
